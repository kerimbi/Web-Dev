<div class="product-card">
  <div class="product-header">
    <h3 class="product-name">{{ product.name }}</h3>
    <div class="likes-counter">
      <i class="fas fa-heart" (click)="onLike()"></i>
      <span>{{ product.likes }}</span>
    </div>
  </div>

  <app-image-gallery [images]="product.images"></app-image-gallery>

  <div class="product-info">
    <p class="product-description">{{ product.description }}</p>

    <div class="product-rating">
      <app-star-rating [rating]="product.rating"></app-star-rating>
    </div>

    <div class="product-price">
      {{ product.price | number }} ₸
    </div>

    <div class="product-actions">
      <a [href]="product.link" target="_blank" class="btn btn-primary">
        View on Kaspi.kz
      </a>

      <div class="action-buttons">
        <button class="btn btn-success" (click)="shareOnWhatsApp()" title="Share on WhatsApp">
          <i class="fab fa-whatsapp"></i>
        </button>
        <button class="btn btn-info" (click)="shareOnTelegram()" title="Share on Telegram">
          <i class="fab fa-telegram"></i>
        </button>
        <button class="btn btn-danger" (click)="onDelete()" title="Delete product">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>
  </div>
</div>
