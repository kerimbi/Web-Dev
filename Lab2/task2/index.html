<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instagram Login Page</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="page">
    <div class="left">
        <img src = "logo-insta.png" />
    </div>
    <div class="right">
        <p>Log in to Instagram</p>
        <div class="form">
            <form action="#">
                <input type="text" placeholder="Mobile number, username or email address" required/>
                <input type="password" placeholder="Password" required/>
                <button class="btn">Log in</button>
                <a href="#">Forgotten password?</a>
                <button class="btn fb">Log in with Facebook </button>
                <button class="btn blue">Create New Account</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
