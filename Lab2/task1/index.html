<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Facebook Login Page</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <div class="container">
            <div class="left">
                <img src = "logo-facebook.png" alt="Logotype Facebook" />
                <h2>Facebook helps you connect and share with the people in your life.</h2>
            </div>
            <div class="right">
                <div class="form-container">
                    <form >
                        <input type="text" placeholder="Email address or Phone number" required/>
                        <input type="password" placeholder="Password" required/>
                        <button class="btn">Log in</button>
                        <a href="#">Forgot Password?</a>
                        <button class="btn green">Create New Account</button>
                    </form>
                </div>
                <p><strong><a href="#">Create a Page</a></strong> for a celebrity, brand or business.</p>
            </div>
    </div>   
</body>
</html>
