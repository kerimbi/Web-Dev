<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: The dinner table</title>
        <style>
        .bgtext1 {
            background-color: rgb(101, 206, 75);
        }
        .bgtext2 {
            background-color: rgb(238, 84, 84);
            }
        .bgtext3 {
            background-color: rgb(243, 215, 121);
        }
        .bgtext4 {
            background-color: rgb(160, 144, 250);
            }    
        </style>
    </head>
    <body>
    
        <h1>Our dinner menu</h1>

        <table>
            <thead>
                <tr>
                    <th class = "bgtext1">Meal</th>
                    <th class = "bgtext1">Ingredients</th>
                    <th class = "bgtext1">Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class = "bgtext3">Beshbarmak</td>
                    <td class = "bgtext4">Meat,onions,potatoes,dough</td>
                    <td class = "bgtext2">7000TNG</td>
                </tr>
                <tr>
                    <td class = "bgtext3">Lagman</td>
                    <td class = "bgtext4">Noodles,beef,potatoes,peppers,carrots,onions,vegetable oil,garlic,tomato paste</td>
                    <td class = "bgtext2">6000TNG</td>
                </tr>
                <tr>
                    <td class = "bgtext3">Burger Deluxe</td>
                    <td class = "bgtext4">Crispy fried chicken breast,cheddar cheese,lettuce,tomato,pickles,mayonnaise</td>
                    <td class = "bgtext2">3000TNG</td>
                </tr>
            </tbody>
        </table>

    </body>
</html>
